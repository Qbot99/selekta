[project]
name = "selekta"
dynamic = ["version"]
description = "Playlista → czysta, zweryfikowana biblioteka DJ-ska (Soulseek hunt, weryfikacja jakości/odsłuchu, BPM+tonacja, eksport rekordbox/Serato, dashboard)"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mutagen>=1.47",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
macos = ["pyobjc-framework-Cocoa>=10.0"]

[project.urls]
Repository = "https://github.com/Qbot99/selekta"

[project.scripts]
selekta = "selekta.cli:main"
selekta-app = "selekta.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["selekta"]

[tool.setuptools.dynamic]
version = {attr = "selekta.__version__"}

[tool.setuptools.package-data]
selekta = ["static/*.html", "static/assets/*", "static/ekrany/*", "static/fonts/*"]
