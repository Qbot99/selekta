name: wydanie

# Tag w stylu v0.3.0 -> zbuduj Selekta.app na Apple Silicon i Intel oraz
# Selekta.exe na Windows, dołącz zipy do wydania na GitHubie.
# Ręczne uruchomienie (Actions → wydanie → Run workflow) buduje bez wydania:
# zipy są do pobrania jako artefakty przebiegu.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          # macos-13 wycofany (2026) — Intel to teraz macos-15-intel
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install ffmpeg
      - name: wersja
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("selekta/__init__.py").read()).group(1))'); fi
          echo "SELEKTA_VERSION=$V" >> "$GITHUB_ENV"
      - run: pip install ".[web,macos]" pyinstaller
      - run: pyinstaller --noconfirm --clean packaging/selekta.spec
      - name: test dymny
        run: |
          SELEKTA_PORT=8799 SELEKTA_BEZ_PRZEGLADARKI=1 dist/Selekta.app/Contents/MacOS/Selekta &
          PID=$!
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8799/api/status >/dev/null; then echo OK; break; fi
            sleep 0.5
          done
          curl -fs http://127.0.0.1:8799/api/status
          kill $PID
      - name: zip
        run: cd dist && ditto -c -k --keepParent Selekta.app "Selekta-${SELEKTA_VERSION}-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Selekta-${{ matrix.arch }}
          path: dist/Selekta-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # statyczny ffmpeg (bez DLL-i obok); shim z chocolatey nie nadaje się do paczki
      - name: ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = (Get-ChildItem -Recurse ffmpeg -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "SELEKTA_FFMPEG=$bin\ffmpeg.exe" >> $env:GITHUB_ENV
          "SELEKTA_FFPROBE=$bin\ffprobe.exe" >> $env:GITHUB_ENV
      - name: wersja
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("selekta/__init__.py").read()).group(1))'); fi
          echo "SELEKTA_VERSION=$V" >> "$GITHUB_ENV"
      - run: pip install ".[web]" pyinstaller
      - run: pyinstaller --noconfirm --clean packaging/selekta.spec
      - name: test dymny
        shell: pwsh
        run: |
          if (-not (Get-ChildItem -Recurse dist\Selekta -Filter ffmpeg.exe)) { throw "brak ffmpeg.exe w paczce" }
          $env:SELEKTA_PORT = "8799"; $env:SELEKTA_BEZ_PRZEGLADARKI = "1"
          $p = Start-Process -FilePath dist\Selekta\Selekta.exe -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8799/api/status -UseBasicParsing | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if ($ok) {
            Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing | Out-Null
            Invoke-WebRequest http://127.0.0.1:8799/api/tracks -UseBasicParsing | Out-Null
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "test dymny NIE PRZESZEDŁ — Selekta.exe nie odpowiada" }
          "test dymny OK"
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path dist\Selekta -DestinationPath "dist\Selekta-$env:SELEKTA_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Selekta-windows-x64
          path: dist/Selekta-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zipy
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zipy/*.zip
          generate_release_notes: true
          body: |
            **Jak zainstalować (macOS):** pobierz zip dla swojego Maca
            (`arm64` = Apple Silicon M1/M2/M3/M4, `x86_64` = Intel), rozpakuj,
            przenieś Selekta.app do Aplikacji. Apka nie jest podpisana
            certyfikatem Apple, więc przy pierwszym otwarciu macOS ją zatrzyma:
            na macOS 15+ wejdź w Ustawienia systemowe → Prywatność
            i bezpieczeństwo → **„Otwórz mimo to"**; na starszych kliknij ikonę
            prawym przyciskiem → Otwórz. Pyta tylko raz.

            **Windows (10/11, 64-bit):** pobierz `windows-x64.zip`, rozpakuj
            i uruchom `Selekta\Selekta.exe`. Windows SmartScreen może ostrzec
            o nieznanym wydawcy (apka nie ma płatnego certyfikatu): „Więcej
            informacji” → „Uruchom mimo to”. Okno konsoli pokazuje, że Selekta
            działa — zamknięcie go wyłącza aplikację.
