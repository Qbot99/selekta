[pytest]
testpaths = tests
addopts = -q --tb=short

# Testy importują `tests.conftest`, więc korzeń projektu musi być na sys.path.
# Wcześniej wchodził tam przypadkiem, przez instalację editable — teraz wprost.
pythonpath = .
markers =
    network: testy wymagające internetu (Spotify/Beatport/iTunes/YouTube)
    slow: testy trwające >10 s (pełne dekodowanie, DSP)

# Katalogi tymczasowe testów potrafią urosnąć do gigabajtów (kopie audio),
# więc trzymamy tylko te z nieudanych testów i tylko z ostatniego przebiegu.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
