<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selekta</title>
<link rel="icon" href="/static/assets/selekta-mark.png">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
/* ============================================================
   Powłoka dashboardu — projekt graficzny z 3.09.2026 (docs/design).
   Tokeny 1:1 z projektu; ekrany w static/ekrany/*.js korzystają z tych
   klas albo kopiują style inline z projektu (piksel w piksel).
   ============================================================ */
:root{
  --bg:#0f0d0c; --tlo-kanwy:#070606;
  --panel:#171412; --panel2:#1e1a17; --hover:#1a1613; --panel-ciemny:#141110;
  --line:#2a2522; --line2:#1d1917; --line3:#3a3330;
  --txt:#f2ece6; --muted:#c9c0b8; --dim:#8f857c; --dim2:#5e5650;
  --acc:#ff6a3d; --acc-h:#ff8a66; --acc-tlo:rgba(255,106,61,.06);
  --ok:#5cd6a0; --ok-tlo:#123a2b; --warn:#f0b64a; --warn-tlo:#3a2f12; --bad:#ff5a6a; --info:#7a9cff;
  --font:'Urbanist',system-ui,-apple-system,sans-serif; --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc-h)}
input,textarea,button,select{font-family:inherit;font-size:inherit;color:inherit}
textarea:focus,input:focus{outline:none}
button{cursor:pointer}
::selection{background:var(--acc);color:#0f0d0c}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2522;border-radius:6px;border:2px solid var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes wjazd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition:none!important}}
.hide{display:none!important}

/* ---------- okno: pasek tytułu · nawigacja · treść · player ---------- */
#okno{height:100vh;display:grid;grid-template-columns:232px 1fr;grid-template-rows:44px 1fr auto;overflow:hidden}
.titlebar{grid-column:1/3;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid var(--line2);-webkit-app-region:drag;user-select:none}
.titlebar .kropka{width:12px;height:12px;border-radius:50%;background:var(--line3);flex-shrink:0}
.titlebar .tytul{margin:0 auto;font:500 11px var(--mono);letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .prawy{width:auto;min-width:52px;display:flex;justify-content:flex-end;-webkit-app-region:no-drag}
.titlebar .prawy button{background:transparent;border:0;color:var(--dim2);font:500 11px var(--mono);letter-spacing:.1em;padding:6px 8px;border-radius:6px}
.titlebar .prawy button:hover{color:var(--acc)}

#nav{border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:24px 16px 20px;gap:22px;overflow:auto}
#nav .logo{display:flex;align-items:center;gap:10px;padding:0 8px;cursor:pointer}
#nav .logo img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,106,61,.45))}
#nav .logo span{font-weight:800;font-size:19px;letter-spacing:.06em}
#nav .grupa{display:flex;flex-direction:column;gap:2px}
#nav .grupa .head{font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--dim2);padding:0 8px 8px;text-transform:uppercase}
#nav .poz{display:flex;align-items:center;padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--dim);user-select:none}
#nav .poz:hover{color:var(--txt)}
#nav .poz.on{background:var(--panel2);color:var(--txt)}
#nav .poz .badge{margin-left:auto;font:600 10.5px var(--mono);background:var(--acc);color:#0f0d0c;border-radius:10px;padding:1px 7px}
#nav .poz .badge:empty{display:none}
#nav .stopka{margin-top:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);padding:0 8px}

#glowna{overflow:hidden;display:flex;flex-direction:column;min-height:0}
#ekrany{flex:1;min-height:0;display:flex;flex-direction:column}
.ekran{flex:1;min-height:0;padding:32px 36px 28px;display:flex;flex-direction:column;gap:20px;overflow:hidden;animation:wjazd .18s ease-out}
.ekran.przewijany{overflow:auto}

#pelne{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
#pelne .ekran{padding:0}

/* ---------- player (dolny pasek z projektu 2c) ---------- */
#player{grid-column:1/3;height:64px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:18px;padding:0 28px}
#player .play{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#0f0d0c;display:grid;place-items:center;font-size:11px;cursor:pointer;flex-shrink:0;border:0}
#player .kto{width:220px;min-width:0}
#player .kto .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .kto .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .pasek{flex:1;display:flex;align-items:center;gap:12px}
#player .pasek .czas{font:500 11.5px var(--mono);color:var(--dim);min-width:34px}
#player .fala{flex:1;height:26px;display:flex;align-items:center;gap:2px;cursor:pointer}
#player .fala .zagrane{height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 4px);opacity:.9;border-radius:2px}
#player .fala .reszta{height:100%;background:repeating-linear-gradient(90deg,var(--line3) 0 2px,transparent 2px 4px);border-radius:2px}
#player .meta{font:500 11px var(--mono);color:var(--dim2);white-space:nowrap}
#player .blad{font-size:12px;color:var(--bad)}

/* ---------- nagłówki ekranów ---------- */
.naglowek{display:flex;align-items:flex-end;gap:16px}
.naglowek h1,.h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.naglowek .sub,.sub{font-size:13.5px;color:var(--dim);margin-top:8px}
.naglowek .akcje{margin-left:auto;display:flex;gap:10px;align-items:center;flex-shrink:0}
.kicker{font:500 11px var(--mono);letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.etyk{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.mono{font-family:var(--mono);font-weight:500}
.dim{color:var(--dim)} .dim2{color:var(--dim2)} .muted{color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .info{color:var(--info)} .acc{color:var(--acc)}

/* ---------- panele, kafle, wiersze ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.panel.pad{padding:20px 22px}
.panel.pad-l{padding:22px 24px}
.panel .head{display:flex;align-items:center;gap:10px}
.kafle{display:grid;gap:12px}
.kafle.c3{grid-template-columns:repeat(3,1fr)} .kafle.c4{grid-template-columns:repeat(4,1fr)}
.kafel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kafel .liczba{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kafel .liczba small{font-size:13px;color:var(--dim);margin-left:4px;font-weight:400;letter-spacing:0}
.kafel .etyk{margin-top:8px}
.kafel.poziomy{padding:14px 18px;display:flex;align-items:baseline;gap:10px}
.kafel.poziomy .liczba{font-size:28px}
.lista{overflow:auto;flex:1;min-height:0}
.wiersz{border-bottom:1px solid var(--line2)}
.wiersz:hover{background:var(--hover)}
.uwaga{border-left:2px solid var(--warn);padding:6px 0 6px 12px;font-size:12.5px;color:var(--dim);line-height:1.45}
.uwaga b{color:var(--warn)}

/* ---------- przyciski, segmenty, znaczniki ---------- */
.btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 16px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.acc{background:var(--acc);color:#0f0d0c;border:0;font-weight:800}
.btn.acc:hover{background:var(--acc-h)}
.btn.acc.duzy{border-radius:10px;padding:13px 22px;font-size:14px;letter-spacing:.04em}
.btn.acc.glow{border-radius:12px;padding:16px 28px;font-size:15px;letter-spacing:.06em;box-shadow:0 0 30px rgba(255,106,61,.35)}
.btn.obrys{background:transparent;border:1px solid var(--acc);color:var(--acc);font-weight:800;letter-spacing:.04em}
.btn.obrys:hover{background:var(--acc);color:#0f0d0c}
.btn.cichy{background:transparent;color:var(--dim)}
.btn.cichy:hover{color:var(--txt);border-color:var(--line3)}
.btn.goly{background:transparent;border:0;color:var(--dim2);padding:9px 10px}
.btn.goly:hover{color:var(--txt)}
.btn.goly.zly:hover{color:var(--bad)}
.btn.mini{padding:6px 12px;font-size:12px;border-radius:7px}
.btn.mini.acc{font-weight:700}
.btn.sr{padding:8px 13px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg.ciemny{background:var(--bg);border-radius:8px;padding:2px}
.seg>span,.seg>button{padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--dim);cursor:pointer;background:transparent;border:0;white-space:nowrap}
.seg.ciemny>span,.seg.ciemny>button{padding:4px 10px;font-size:12px;border-radius:6px}
.seg>.on{background:var(--panel2);color:var(--txt)}
.seg.mono>span,.seg.mono>button{font:600 11px var(--mono)}
.seg.mono>.on{background:var(--acc);color:#0f0d0c}
.tag{font:600 10px var(--mono);letter-spacing:.1em;padding:4px 8px;border-radius:5px;text-align:center;color:#0f0d0c;text-transform:uppercase}
.fmt{font:600 10.5px var(--mono);padding:3px 8px;border-radius:5px;width:max-content}
.fmt.flac{background:var(--ok-tlo);color:var(--ok)} .fmt.wav,.fmt.aiff,.fmt.aif{background:var(--warn-tlo);color:var(--warn)} .fmt.mp3,.fmt.m4a,.fmt.ogg{background:#2a2521;color:#b0a69c}
.cam{font:600 11px var(--mono);padding:2px 0;border-radius:4px;text-align:center;width:38px;display:inline-block;color:#0f0d0c}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line3);display:inline-block;flex-shrink:0}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.acc{background:var(--acc)} .dot.info{background:var(--info)}
.dot.swieci{box-shadow:0 0 8px currentColor}
.dot.ok.swieci{box-shadow:0 0 8px var(--ok)} .dot.acc.swieci{box-shadow:0 0 8px var(--acc)}
.dot.pulsuje{animation:pulse 1.2s ease-in-out infinite}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
.przelacznik{width:36px;height:20px;border-radius:10px;background:var(--line3);position:relative;cursor:pointer;flex-shrink:0;border:0;padding:0}
.przelacznik::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#0f0d0c;transition:left .15s}
.przelacznik.on{background:var(--acc)} .przelacznik.on::after{left:18px}
.pole{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 14px;color:var(--txt);font-size:13.5px}
.pole:focus{border-color:var(--acc)}
.pole::placeholder{color:var(--dim2)}
.pasek-post{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.pasek-post>i{display:block;height:100%;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:width .3s}
.okladka{border-radius:7px;background:repeating-linear-gradient(135deg,#221d1a 0 4px,#1a1613 4px 8px);object-fit:cover;flex-shrink:0}
.pusto{padding:40px;text-align:center;color:var(--dim2);font-size:13.5px}

/* ---------- arkusz (2b, 3c) i powiadomienia ---------- */
#arkusz{position:fixed;inset:44px 0 0 0;background:rgba(7,6,6,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:40px;z-index:50;overflow:auto}
#arkusz .sheet{width:860px;max-width:100%;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 30px;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:wjazd .16s ease-out}
#toasty{position:fixed;right:20px;bottom:84px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:wjazd .15s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
</style>
</head>
<body>

<div id="okno">
  <div class="titlebar">
    <span class="kropka"></span><span class="kropka"></span><span class="kropka"></span>
    <span class="tytul" id="tytulOkna">selekta</span>
    <span class="prawy"><button id="doKreatora" title="Tryb automatyczny: wklejasz playlistę, klikasz dalej, grasz">▶ TRYB AUTO</button></span>
  </div>

  <aside id="nav">
    <div class="logo" id="navLogo"><img src="/static/assets/selekta-mark.png" alt=""><span>selekta</span></div>
    <div class="grupa">
      <div class="head">Set</div>
      <div class="poz" data-ekran="import">Import</div>
      <div class="poz" data-ekran="kolejnosc">Kolejność setu</div>
      <div class="poz" data-ekran="eksport">Eksport</div>
      <div class="poz" data-ekran="pobierania">Pobierania<span class="badge" id="badge-pobierania"></span></div>
    </div>
    <div class="grupa">
      <div class="head">Biblioteka</div>
      <div class="poz" data-ekran="biblioteka">Biblioteka</div>
      <div class="poz" data-ekran="zdrowie">Zdrowie</div>
      <div class="poz" data-ekran="uchem">Sprawdź uchem<span class="badge" id="badge-uchem"></span></div>
      <div class="poz" data-ekran="porzadki">Porządki<span class="badge" id="badge-porzadki"></span></div>
      <div class="poz" data-ekran="radar">Radar</div>
    </div>
    <div class="grupa">
      <div class="head">Więcej</div>
      <div class="poz" data-ekran="statystyki">Statystyki</div>
      <div class="poz" data-ekran="historia">Historia</div>
      <div class="poz" data-ekran="ustawienia">Ustawienia</div>
    </div>
    <div class="stopka"><span class="dot" id="navSlsk"></span><span id="navSlskTxt">sprawdzam Soulseek…</span></div>
  </aside>

  <main id="glowna"><div id="ekrany"></div></main>

  <div id="player" class="hide">
    <button class="play" id="playerBtn" title="pauza">❚❚</button>
    <div class="kto"><div class="t" id="playerTytul"></div><div class="a" id="playerArtysta"></div></div>
    <div class="pasek">
      <span class="czas" id="playerCzas">0:00</span>
      <div class="fala" id="playerFala"><span class="zagrane" style="flex:0"></span><span class="reszta" style="flex:1"></span></div>
      <span class="czas" id="playerDlugosc">0:00</span>
    </div>
    <span class="meta" id="playerMeta"></span>
  </div>
</div>

<div id="pelne" class="hide"></div>
<div id="arkusz" class="hide"><div class="sheet" id="arkuszBody"></div></div>
<div id="toasty"></div>

<script src="/static/ekrany/_powloka.js?v=__WERSJA__"></script>
<script src="/static/ekrany/kreator.js?v=__WERSJA__"></script>
<script src="/static/ekrany/biblioteka.js?v=__WERSJA__"></script>
<script src="/static/ekrany/set.js?v=__WERSJA__"></script>
<script src="/static/ekrany/porzadki.js?v=__WERSJA__"></script>
<script src="/static/ekrany/wiecej.js?v=__WERSJA__"></script>
<script>S.start();</script>
</body>
</html>
